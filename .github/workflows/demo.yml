name: Deploy demo
# Publishes demo/ to GitHub Pages. In the repository settings, set Pages > Source to "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ['demo/**', '.github/workflows/demo.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the model from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "${{ github.repository }}" --pattern spindle.cact --dir demo
      - name: Leave out files the site does not need
        run: rm -f demo/node-test.mjs demo/node-examples.mjs demo/package.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v4
